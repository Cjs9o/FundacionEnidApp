# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# Compilación offline: usa artefactos ya cacheados (Firebase incluido).
# Si agregas dependencias nuevas, ponlo temporalmente en false para descargarlas.
org.gradle.offline=true
# Room (KSP) registra sus carpetas generadas con el DSL `kotlin.sourceSets`,
# que AGP 9 built-in Kotlin rechaza. Se permite para que Room compile.
android.disallowKotlinSourceSets=false